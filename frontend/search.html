<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Users - Connectly</title>
  <script src="/js/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header id="navbar"></header>

  <main class="main-layout" style="grid-template-columns: 1fr; max-width: 750px;">
    <div class="card" style="margin-bottom: 1.25rem;">
      <h2 style="font-family: var(--font-editorial); font-size: 1.85rem; color: var(--text-main); margin-bottom: 0.4rem;">
        Discover People
      </h2>
      <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1.25rem;">
        Search for users on Connectly by their username to view their profile and follow their updates.
      </p>

      <div style="position: relative; display: flex; align-items: center;">
        <input type="text" id="searchInput" class="form-control" placeholder="Search by username..." style="padding-left: 2.75rem; padding-right: 2.5rem;" />
        <svg width="20" height="20" fill="none" stroke="var(--text-muted)" viewBox="0 0 24 24" style="position: absolute; left: 0.9rem; pointer-events: none;">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <button id="clearSearchBtn" type="button" aria-label="Clear search input" style="display: none; position: absolute; right: 0.75rem; background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 0.25rem;">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
    </div>

    <!-- Search Results Container -->
    <div id="searchResults"></div>
  </main>

  <nav id="mobileNav"></nav>

  <script src="/js/toast.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/search.js"></script>
</body>
</html>
