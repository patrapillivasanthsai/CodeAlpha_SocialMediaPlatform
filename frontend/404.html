<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Connectly</title>
  <script src="/js/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header id="navbar"></header>

  <main class="main-layout" style="grid-template-columns: 1fr; max-width: 600px; padding-top: 3rem;">
    <div class="card" style="text-align: center; padding: 3.5rem 1.5rem;">
      <h1 style="font-family: var(--font-editorial); font-size: 4.5rem; color: var(--accent); margin-bottom: 0.5rem; line-height: 1;">404</h1>
      <h2 style="font-size: 1.6rem; color: var(--text-main); margin-bottom: 0.75rem;">Page Not Found</h2>
      <p style="color: var(--text-muted); margin-bottom: 1.75rem;">
        The requested page or creator update doesn't exist on Connectly or may have been moved.
      </p>
      <a href="/feed.html" class="btn btn-primary" style="padding: 0.75rem 2rem;">Back to Feed</a>
    </div>
  </main>

  <nav id="mobileNav"></nav>

  <script src="/js/toast.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
</body>
</html>
