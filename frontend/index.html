<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connectly - Modern Social Media Platform</title>
  <script src="/js/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header id="navbar"></header>

  <main class="main-layout" style="grid-template-columns: 1fr; max-width: 900px; padding-top: 2rem;">
    <div class="card" style="text-align: center; padding: 3.5rem 2rem; background: linear-gradient(135deg, var(--bg-card) 0%, var(--primary-light) 100%); border-radius: var(--radius-lg);">
      <div style="width: 70px; height: 70px; background-color: var(--bg-card); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem auto; box-shadow: var(--shadow-md);">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="var(--accent)">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      </div>

      <h1 style="font-family: var(--font-editorial); font-size: 2.8rem; color: var(--text-main); margin-bottom: 1rem; line-height: 1.2;">
        Welcome to Connectly
      </h1>
      <p style="font-size: 1.15rem; color: var(--text-muted); max-width: 600px; margin: 0 auto 2.25rem auto; line-height: 1.6;">
        A modern, human social application built with deep forest green, warm ivory, and rich editorial typography. Share updates, connect with creators, and publish image stories.
      </p>

      <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
        <a href="/feed.html" class="btn btn-primary" style="padding: 0.8rem 2rem;">Explore Feed</a>
        <a href="/login.html" class="btn btn-accent" style="padding: 0.8rem 2rem;">Sign In</a>
        <a href="/register.html" class="btn btn-outline" style="padding: 0.8rem 2rem;">Create Account</a>
      </div>
    </div>
  </main>

  <nav id="mobileNav"></nav>

  <script src="/js/toast.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
</body>
</html>
