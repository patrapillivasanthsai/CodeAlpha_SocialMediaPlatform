<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile - Connectly</title>
  <script src="/js/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header id="navbar"></header>

  <main class="main-layout" style="grid-template-columns: 1fr; max-width: 800px;">
    <!-- Profile Header Info Card -->
    <div id="profileHeaderContainer"></div>

    <h3 style="font-size: 1.25rem; font-weight: 700; color: var(--text-main); margin-top: 1.75rem; margin-bottom: 0.85rem;">
      Published Posts
    </h3>

    <!-- User Posts Stream -->
    <div id="userPostsContainer" class="feed-column"></div>
  </main>

  <nav id="mobileNav"></nav>

  <script src="/js/toast.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/feed.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
