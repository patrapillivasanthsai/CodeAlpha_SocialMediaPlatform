<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Post - Connectly</title>
  <script src="/js/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header id="navbar"></header>

  <main class="main-layout" style="grid-template-columns: 1fr; max-width: 650px;">
    <div class="card" style="padding: 2.25rem;">
      <h2 style="font-family: var(--font-editorial); font-size: 1.95rem; color: var(--text-main); margin-bottom: 1.25rem;">
        Publish New Post
      </h2>

      <form id="createPostPageForm">
        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.3rem;">
            <label class="form-label" for="postContent">What's on your mind? *</label>
            <span id="charCounter" style="font-size: 0.8rem; color: var(--text-muted);">0 / 2000 characters</span>
          </div>
          <textarea id="postContent" class="form-control" rows="5" placeholder="Write your thoughts, announcement, or question here..." required></textarea>
        </div>

        <div class="form-group">
          <label class="form-label" for="postImageUrl">Image URL (Optional)</label>
          <input type="url" id="postImageUrl" class="form-control" placeholder="https://images.unsplash.com/photo-..." />
        </div>

        <!-- Real-time Image Preview Box with Remove Button -->
        <div id="imagePreviewContainer" style="display: none; margin-bottom: 1.25rem;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
            <span class="form-label">Image Preview:</span>
            <button id="removeImageBtn" type="button" class="btn btn-outline btn-sm" style="color: var(--accent); border-color: var(--accent); padding: 0.2rem 0.65rem; font-size: 0.78rem;">
              Remove Image
            </button>
          </div>
          <img id="imagePreviewImg" src="" alt="Preview" style="max-width: 100%; max-height: 320px; border-radius: var(--radius-sm); border: 1px solid var(--border-color); object-fit: cover;" />
        </div>

        <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1.5rem;">
          <a href="/feed.html" class="btn btn-outline">Cancel</a>
          <button type="submit" class="btn btn-primary" style="padding: 0.65rem 1.75rem;">
            Publish Post
          </button>
        </div>
      </form>
    </div>
  </main>

  <nav id="mobileNav"></nav>

  <script src="/js/toast.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/create-post.js"></script>
</body>
</html>
