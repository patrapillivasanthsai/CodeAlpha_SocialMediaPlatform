<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Connectly</title>
  <script src="/js/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header id="navbar"></header>

  <main class="main-layout" style="grid-template-columns: 1fr; max-width: 500px; margin: 2rem auto;">
    <div class="card" style="padding: 2.25rem;">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <h2 style="font-family: var(--font-editorial); font-size: 2.2rem; color: var(--text-main);">Join Connectly</h2>
        <p style="font-size: 0.9rem; color: var(--text-muted); margin-top: 0.25rem;">Create your profile and start sharing</p>
      </div>

      <div id="authAlert" style="display: none;"></div>

      <form id="registerForm">
        <div class="form-group">
          <label class="form-label" for="regUsername">Username *</label>
          <input type="text" id="regUsername" class="form-control" placeholder="e.g. sarah_coder" required minlength="3" />
        </div>

        <div class="form-group">
          <label class="form-label" for="regEmail">Email Address *</label>
          <input type="email" id="regEmail" class="form-control" placeholder="sarah@example.com" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="regPassword">Password *</label>
          <div class="password-input-wrapper">
            <input type="password" id="regPassword" class="form-control" placeholder="At least 6 characters" required minlength="6" />
            <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
              <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regBio">Bio (Optional)</label>
          <textarea id="regBio" class="form-control" rows="2" placeholder="Tell us a little about your interests..."></textarea>
        </div>

        <div class="form-group">
          <label class="form-label" for="regAvatar">Profile Avatar URL (Optional)</label>
          <input type="url" id="regAvatar" class="form-control" placeholder="https://images.unsplash.com/photo-..." />
        </div>

        <button type="submit" class="btn btn-accent btn-block" style="margin-top: 0.75rem; padding: 0.75rem;">
          Create Account
        </button>
      </form>

      <div style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem;">
        Already registered? <a href="/login.html" style="font-weight: 700; color: var(--accent);">Sign in here</a>
      </div>
    </div>
  </main>

  <nav id="mobileNav"></nav>

  <script src="/js/toast.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
