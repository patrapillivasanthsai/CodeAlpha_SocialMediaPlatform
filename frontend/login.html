<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Connectly</title>
  <script src="/js/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header id="navbar"></header>

  <main class="main-layout" style="grid-template-columns: 1fr; max-width: 460px; margin: 2.5rem auto;">
    <div class="card" style="padding: 2.25rem;">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <h2 style="font-family: var(--font-editorial); font-size: 2.2rem; color: var(--text-main);">Welcome Back</h2>
        <p style="font-size: 0.9rem; color: var(--text-muted); margin-top: 0.25rem;">Sign in to your Connectly account</p>
      </div>

      <div id="authAlert" style="display: none;"></div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email or Username</label>
          <input type="text" id="loginEmail" class="form-control" placeholder="alex@example.com" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="loginPassword">Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required />
            <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
              <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 0.75rem; padding: 0.75rem;">
          Sign In
        </button>
      </form>

      <div style="margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border-color); text-align: center;">
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.75rem;">Quick Demo Accounts (1-Click Login):</p>
        <div style="display: flex; gap: 0.5rem; justify-content: center;">
          <button id="demoAlexBtn" type="button" class="btn btn-outline btn-sm">Demo: Alex</button>
          <button id="demoElenaBtn" type="button" class="btn btn-outline btn-sm">Demo: Elena</button>
        </div>
      </div>

      <div style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem;">
        Don't have an account? <a href="/register.html" style="font-weight: 700; color: var(--accent);">Create one here</a>
      </div>
    </div>
  </main>

  <nav id="mobileNav"></nav>

  <script src="/js/toast.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
